<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Service Worker – Unit Tests</title>
</head>
<body>
<h1>Service Worker – Unit Tests</h1>
<div id="output"></div>
<div id="summary"></div>

<!-- sw-shell.js ist die echte Quelle, die auch sw.js per importScripts lädt.
     Keine Kopie der Logik im Test. -->
<script src="../version.js"></script>
<script src="../sw-shell.js"></script>
<script src="_runner.js"></script>
<script>
suite('Service Worker: Cache');

test('CACHE_NAME leitet sich aus APP_VERSION ab', () => {
  assertEqual(SW_CACHE_NAME, 'sw-shell-v' + APP_VERSION);
});

test('Aufräumen löscht nur eigene Caches', () => {
  assertEqual(swShouldDeleteCache('lgc-shell-v1.5.3'), false);
  assertEqual(swShouldDeleteCache('lgc-shell-v' + APP_VERSION), false);
  assertEqual(swShouldDeleteCache('sw-shell-v0.0.9'), true);
  assertEqual(swShouldDeleteCache(SW_CACHE_NAME), false);
  assertEqual(swShouldDeleteCache('irgendwas'), false);
});

suite('Service Worker: Shell-Pfade');

test('swIstShellPfad erkennt die Shell unter einem Unterpfad', () => {
  assertEqual(swIstShellPfad('/SchaffWas/index.html'), true);
  assertEqual(swIstShellPfad('/SchaffWas/app.css'), true);
  assertEqual(swIstShellPfad('/SchaffWas/Logo-icon.png'), true);
  assertEqual(swIstShellPfad('/SchaffWas/'), true);
});

test('swIstShellPfad verwechselt keine ähnlichen Namen', () => {
  assertEqual(swIstShellPfad('/SchaffWas/Logo-icon-irgendwas.png'), false);
  assertEqual(swIstShellPfad('/SchaffWas/daten.json'), false);
  assertEqual(swIstShellPfad('/SchaffWas/unterordner/fremd.js'), false);
  // Kein Teiltreffer mitten im Dateinamen.
  assertEqual(swIstShellPfad('/SchaffWas/mein-app.js'), false);
});

suite('Service Worker: Installation');

// Minimaler Cache-Ersatz. `dateien` ist die Liste, die addAll annehmen soll;
// `fehler` lässt addAll scheitern (Netz weg, Datei fehlt, Quota).
function fakeCache(opt) {
  const o = opt || {};
  const drin = new Set(o.vorhanden || []);
  return {
    aufrufe: [],
    addAll: function (liste) {
      this.aufrufe.push(liste);
      if (o.fehler) return Promise.reject(new Error(o.fehler));
      (o.nimmNur || liste).forEach(p => drin.add(p));
      return Promise.resolve();
    },
    match: function (p) { return Promise.resolve(drin.has(p) ? { ok: true } : undefined); }
  };
}

test('swFehlendeShellDateien meldet nichts bei vollständigem Cache', async () => {
  const cache = fakeCache({ vorhanden: SW_APP_SHELL });
  assertDeepEqual(await swFehlendeShellDateien(cache), []);
});

test('swFehlendeShellDateien nennt genau die fehlenden Einträge', async () => {
  const rest = SW_APP_SHELL.filter(p => p !== './app.css' && p !== './Logo.png');
  const cache = fakeCache({ vorhanden: rest });
  assertDeepEqual(await swFehlendeShellDateien(cache), ['./app.css', './Logo.png']);
});

test('eine vollständige Installation gelingt', async () => {
  const cache = fakeCache();
  assertEqual(await swInstalliereShell(cache), true);
  assertDeepEqual(cache.aufrufe[0], SW_APP_SHELL);
});

test('scheitert addAll, scheitert die Installation', async () => {
  const cache = fakeCache({ fehler: 'Netz weg' });
  let abgelehnt = false;
  await swInstalliereShell(cache).then(() => {}, () => { abgelehnt = true; });
  assert(abgelehnt, 'swInstalliereShell hat den Fehler verschluckt');
});

test('ein unvollständiger Cache gilt als Installationsfehler', async () => {
  // addAll meldet Erfolg, aber eine Datei liegt nicht im Cache (z. B. weil
  // der Speicher zwischendurch aufgeräumt wurde).
  const cache = fakeCache({ nimmNur: SW_APP_SHELL.filter(p => p !== './index.html') });
  let fehler = null;
  await swInstalliereShell(cache).then(() => {}, e => { fehler = e; });
  assert(fehler, 'halbe Shell wurde als Erfolg gewertet');
  assert(/index\.html/.test(fehler.message), 'Fehler nennt die Datei nicht: ' + fehler.message);
});

suite('Service Worker: Lebenszyklus');

test('der Install-Handler übergeht keinen Fehler und drängelt nicht', async () => {
  const src = await (await fetch('../sw.js')).text();
  const von = src.indexOf("addEventListener('install'");
  // Bis zum nächsten Handler, egal in welcher Reihenfolge sie stehen.
  const bis = src.indexOf('self.addEventListener', von + 1);
  assert(von !== -1 && bis > von, 'Install-Handler nicht gefunden');
  const block = src.slice(von, bis);
  assert(block.indexOf('skipWaiting') === -1, 'der Install ruft noch skipWaiting');
  assert(block.indexOf('catch') === -1, 'der Install verschluckt den Fehler noch');
});

test('das Warten wird nur auf Nachricht hin übersprungen', async () => {
  const src = await (await fetch('../sw.js')).text();
  assert(/addEventListener\('message'/.test(src), 'kein message-Handler in sw.js');
  assert(/SKIP_WAITING/.test(src), 'SKIP_WAITING kommt in sw.js nicht vor');
  assert(/skipWaiting/.test(src.slice(src.indexOf("addEventListener('message'"))),
    'der message-Handler ruft kein skipWaiting');
});

suite('Service Worker: App-Shell');

test('APP_SHELL enthält alle App-Dateien', () => {
  const muss = [
    './', './index.html', './app.css', './manifest.json',
    './version.js', './storage.js', './model.js', './clock.js', './taunts.js',
    './ui.js', './ui-main.js', './ui-log.js', './ui-history.js', './ui-settings.js', './app.js',
    './Logo.png', './Logo-Sau.png', './Logo-Schriftzug.png', './Logo-icon.png', './Logo-icon-maskable.png'
  ];
  muss.forEach(p => assert(SW_APP_SHELL.indexOf(p) !== -1, 'fehlt in APP_SHELL: ' + p));
});

test('APP_SHELL nutzt ausschließlich relative Pfade', () => {
  SW_APP_SHELL.forEach(p => assert(p.indexOf('./') === 0, 'nicht relativ: ' + p));
});

test('APP_SHELL enthält keine Doppelten', () => {
  assertEqual(new Set(SW_APP_SHELL).size, SW_APP_SHELL.length);
});

test('jede Datei aus APP_SHELL ist auch wirklich da', async () => {
  for (const p of SW_APP_SHELL) {
    if (p === './') continue;
    const res = await fetch('../' + p.slice(2));
    assert(res.ok || res.status === 0, 'nicht ladbar: ' + p + ' (' + res.status + ')');
  }
});

suite('Manifest');

test('manifest.json ist gültiges JSON mit relativen Pfaden', async () => {
  const m = await (await fetch('../manifest.json')).json();
  assertEqual(m.name, 'Schaff was!');
  assertEqual(m.start_url.indexOf('./'), 0);
  assertEqual(m.scope.indexOf('./'), 0);
  assertEqual(m.display, 'standalone');
  assertEqual(m.orientation, 'portrait');
  assertEqual(m.theme_color, '#15181d');
  m.icons.forEach(i => assert(i.src.indexOf('./') === 0, 'Icon nicht relativ: ' + i.src));
});

test('Manifest führt ein normales und ein maskierbares Icon', async () => {
  const m = await (await fetch('../manifest.json')).json();
  const zwecke = m.icons.map(i => i.purpose);
  assert(zwecke.indexOf('any') !== -1, 'purpose any fehlt');
  assert(zwecke.indexOf('maskable') !== -1, 'purpose maskable fehlt');
  m.icons.forEach(i => assertEqual(i.sizes, '512x512'));
});

test('index.html lädt alle Skripte, die APP_SHELL nennt', async () => {
  const html = await (await fetch('../index.html')).text();
  ['storage.js', 'model.js', 'clock.js', 'taunts.js', 'ui.js', 'ui-main.js',
   'ui-log.js', 'ui-history.js', 'ui-settings.js', 'app.js', 'version.js'].forEach(f => {
    assert(html.indexOf('./' + f) !== -1, 'index.html lädt nicht: ' + f);
  });
});

runAll();
</script>
</body>
</html>
